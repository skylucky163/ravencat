plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.kimiphonenotifications'
version = '1.0.0'

android {
  namespace "expo.modules.kimiphonenotifications"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
  testOptions { unitTests { includeAndroidResources = true } }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  implementation project(':background-runtime')
  implementation project(':call-ringtone')
  implementation project(':android-overlay-runtime')
  compileOnly "com.facebook.react:react-android"
  implementation "androidx.core:core-ktx:1.13.1"
  testImplementation 'junit:junit:4.13.2'
  testImplementation 'org.robolectric:robolectric:4.14.1'
}
